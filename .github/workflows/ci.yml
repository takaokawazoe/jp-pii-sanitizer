name: ci

# linux:   builds the whole tree on Linux (proving the platform-independent core + CLI
#          are cross-platform), runs the conformance suite plus CLI and Excel-helper smoke
#          tests, and measures detection quality with the eval harness.
# windows: builds the Excel helper with MSVC, the Excel-DNA XLL and the per-user installer
#          (excel/installer), runs the core tests + helper self-test on Windows, and uploads
#          the setup.exe as an artifact. On a v* tag it is attached to a draft Release.
# The WebView2 GUI target is not built in CI (needs Aspose + WebView2 SDK vendored).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      JPPII_REPO: ${{ github.repository }}
      JPPII_TAG: v0.1.0
    steps:
      # Actions はタグではなく commit SHA で固定する。タグは動かせるので、上流が差し替わると
      # 黙って別のコードが走る。更新は SHA を書き換える意図的な操作にする。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: apt dependencies
        run: |
          sudo apt-get update
          # libsodium: 対応表のパスフレーズ暗号化（Argon2id + XChaCha20-Poly1305）
          sudo apt-get install -y build-essential cmake ninja-build pkg-config unzip curl \
                                  libsodium-dev

      # rustup のインストーラはバージョン付きの配布物が無く、ハッシュ固定ができない。
      # ここは**未固定であることを承知の上**で使っている（残っている供給網の穴）。
      - name: rust toolchain (tokenizer / sudachi shims)
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: fetch third_party (pinned versions)
        run: |
          set -euxo pipefail
          mkdir -p cpp/third_party
          cd cpp/third_party
          curl -fsSL -O https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-linux-x64-1.27.0.tgz
          tar xzf onnxruntime-linux-x64-1.27.0.tgz && mv onnxruntime-linux-x64-1.27.0 onnxruntime
          curl -fsSL -o json.hpp https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp
          curl -fsSL -O https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz
          tar xzf pcre2-10.44.tar.gz && mv pcre2-10.44 pcre2
          curl -fsSL -O https://github.com/richgel999/miniz/releases/download/3.0.2/miniz-3.0.2.zip
          mkdir -p miniz && (cd miniz && unzip -o ../miniz-3.0.2.zip)
          curl -fsSL -O https://github.com/zeux/pugixml/releases/download/v1.14/pugixml-1.14.tar.gz
          tar xzf pugixml-1.14.tar.gz && mv pugixml-1.14 pugixml
          curl -fsSL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7947/pdfium-linux-x64.tgz"
          mkdir pdfium && tar xzf pdfium.tgz -C pdfium
          # **commit で固定する。** ここだけ可変参照（HEAD 追従）で、上流が改変されると
          # 黙ってビルドに入っていた。他の third_party は URL でバージョンが固定されている。
          git clone https://github.com/aspose-email-foss/Aspose.Email-FOSS-for-CPP aspose-email
          (cd aspose-email && git checkout -q fef9c934c3ad7a207c97cc24546176e678f577af)
          (cd aspose-email && git apply ../../patches/aspose-any_to_string-binary.patch)

      - name: cache model + dictionary bundle
        id: models-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: cpp/models
          key: models-${{ env.JPPII_TAG }}

      - name: fetch model + dictionary bundle (from Release)
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: bash ./cpp/tools/fetch_assets.sh

      - name: build (conformance tests + CLI)
        working-directory: cpp
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: unit tests (encoding boundaries, mapping I/O incl. encryption)
        working-directory: cpp
        run: ./build/unit_tests

      # 期待値は Python 参照実装から生成したもの（cpp/README.md の注記を参照）。
      # Python 側は休止しており、これらは回帰試験として運用している。
      - name: conformance tests (pinned behaviour oracles)
        working-directory: cpp
        run: |
          set -euxo pipefail
          ./build/phase0_tokenize
          ./build/phase0_parity models/model_fp16.onnx
          ./build/phase1_sudachi
          ./build/phase2_regex
          ./build/phase2_hf
          ./build/phase2_pipeline
          ./build/phase3_tokenize
          ./build/phase4_extract
          ./build/phase4_msg
          ./build/phase4_eml
          ./build/phase5_core

      - name: CLI smoke (detect / mask / restore round-trip)
        working-directory: cpp
        run: |
          set -euxo pipefail
          printf '本日、山田太郎さんが対応しました。\n' > /tmp/p.txt
          printf '%s\n' '{"type":"PERSON","text":"山田太郎"}' > /tmp/cand.jsonl
          ./build/jp-pii-sanitizer-cli mask /tmp/p.txt --candidates /tmp/cand.jsonl \
              --reversible --mapping /tmp/map.jsonl --data models -o /tmp/masked.txt
          grep -q 'PERSON_1' /tmp/masked.txt
          ! grep -q '山田太郎' /tmp/masked.txt
          ./build/jp-pii-sanitizer-cli restore --mapping /tmp/map.jsonl -i /tmp/masked.txt -o /tmp/restored.txt
          grep -q '山田太郎' /tmp/restored.txt

      - name: CLI smoke (passphrase-protected mapping)
        working-directory: cpp
        run: |
          set -euxo pipefail
          printf '本日、山田太郎さんが対応しました。\n' > /tmp/p.txt
          printf '%s\n' '{"type":"PERSON","text":"山田太郎"}' > /tmp/cand.jsonl
          printf 'K7QM3-P4XR9-2FTBH-6YN8D\n' > /tmp/pass.txt
          ./build/jp-pii-sanitizer-cli mask /tmp/p.txt --candidates /tmp/cand.jsonl \
              --reversible --encrypt-mapping --passphrase-file /tmp/pass.txt \
              --mapping /tmp/enc.jsonl --data models -o /tmp/masked2.txt
          # 対応表は封筒に入っている: 実値もトークンも平文では現れない
          ! grep -q '山田太郎' /tmp/enc.jsonl
          ! grep -q 'PERSON_1' /tmp/enc.jsonl
          grep -q '"version":2' /tmp/enc.jsonl
          # 正しいパスフレーズで戻せる / 違うパスフレーズは失敗する（0 件成功にしない）
          ./build/jp-pii-sanitizer-cli restore --mapping /tmp/enc.jsonl -i /tmp/masked2.txt \
              --passphrase-file /tmp/pass.txt -o /tmp/restored2.txt
          grep -q '山田太郎' /tmp/restored2.txt
          printf 'wrong\n' > /tmp/bad.txt
          ! ./build/jp-pii-sanitizer-cli restore --mapping /tmp/enc.jsonl -i /tmp/masked2.txt \
              --passphrase-file /tmp/bad.txt -o /tmp/nope.txt


      # .eml は自前の MIME 抽出（Aspose 非依存）。文字コード変換は Windows と POSIX で
      # 実装が違う（MultiByteToWideChar と iconv）ので、Linux でも通ることを確かめる。
      - name: CLI smoke (.eml / ISO-2022-JP)
        working-directory: cpp
        run: |
          set -euxo pipefail
          ./build/jp-pii-sanitizer-cli detect testdata/eml/02_iso2022jp_qp.eml --data models > /tmp/eml.jsonl
          grep -q '佐藤美咲' /tmp/eml.jsonl
          grep -q '渡辺隆志' /tmp/eml.jsonl

      # Excel アドイン用ヘルパー（docs/excel-helper.md）。--selftest はプロセス内で
      # セル境界の不変条件・対応表の往復・フレーミングを検査し、helper_smoke.py は
      # 実プロセスを --stdio で叩く（アドインがやる順序そのまま）。
      - name: helper (self-test + stdio smoke)
        working-directory: cpp
        run: |
          set -euxo pipefail
          ./build/jp-pii-helper --selftest --data models
          python3 tools/helper_smoke.py ./build/jp-pii-helper --data models

      # 検知精度の測定。適合試験（挙動が変わっていないか）とは別で、こちらは
      # 「どれだけ捕まえられているか」を測る。
      #
      # 下限はラチェット。**Windows/MSVC と ubuntu で同一の数値が出ることを実測してから**
      # 設定した（197/198・往復 9/10・誤検知 0/24）。ONNX も PDFium も別ビルドなので事前には
      # 保証が無く、1 回測ってから決めた。
      #
      # 下げるときは意図的な判断として下げること（精度を落とす変更を黙って通さないための門）。
      # 誤検知は閾値ではなく真偽なので、指定が無くても 1 件でもあれば eval は非ゼロ終了する。
      - name: eval (detection quality)
        working-directory: cpp
        run: ./build/eval --data models --samples ../samples --min-mask 197 --min-roundtrip 9

  # Excel アドイン一式（docs/excel-helper.md・excel/README.md）。ヘルパーは MSVC でビルドし、
  # コアの等価性テストが Windows でも Python と一致することを確かめる。XLL と per-user
  # インストーラは excel/installer/build_installer.ps1 で作り、setup.exe を成果物に載せる。
  # タグ（v*）のときは Release（ドラフト）に添付する——公開は人が確認してから。
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # タグのときに Release へ setup.exe を付けるためだけ
    env:
      JPPII_REPO: ${{ github.repository }}
      JPPII_TAG: v0.1.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Linux と同じ版を Windows 向けプリビルドで。libsodium は "-stable" ではなく版番号の
      # zip（stable は中身が動く）。Aspose と WebView2 は要らない（GUI/CLI は作らない）。
      - name: fetch third_party (pinned versions)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force cpp/third_party | Out-Null
          Set-Location cpp/third_party
          curl.exe -fsSL -O https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-win-x64-1.27.0.zip
          Expand-Archive onnxruntime-win-x64-1.27.0.zip -DestinationPath . ; Rename-Item onnxruntime-win-x64-1.27.0 onnxruntime
          curl.exe -fsSL -o json.hpp https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp
          curl.exe -fsSL -O https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz
          tar xzf pcre2-10.44.tar.gz ; Rename-Item pcre2-10.44 pcre2
          curl.exe -fsSL -O https://github.com/richgel999/miniz/releases/download/3.0.2/miniz-3.0.2.zip
          Expand-Archive miniz-3.0.2.zip -DestinationPath miniz
          curl.exe -fsSL -O https://github.com/zeux/pugixml/releases/download/v1.14/pugixml-1.14.tar.gz
          tar xzf pugixml-1.14.tar.gz ; Rename-Item pugixml-1.14 pugixml
          curl.exe -fsSL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7947/pdfium-win-x64.tgz"
          New-Item -ItemType Directory pdfium | Out-Null ; tar xzf pdfium.tgz -C pdfium
          curl.exe -fsSL -o libsodium-msvc.zip https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-msvc.zip
          Expand-Archive libsodium-msvc.zip -DestinationPath .

      - name: cache model + dictionary bundle
        id: models-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: cpp/models
          key: models-win-${{ env.JPPII_TAG }}

      - name: fetch model + dictionary bundle (from Release)
        if: steps.models-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./cpp/tools/fetch_assets.ps1

      # Rust シム（tokenizers / sudachi.rs）は毎回ビルドすると数分掛かる。Cargo.lock で鍵にする
      - name: cache rust shims
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            cpp/tokenizer-shim/target
            cpp/sudachi-shim/target
          key: rust-shims-win-${{ hashFiles('cpp/tokenizer-shim/Cargo.lock', 'cpp/sudachi-shim/Cargo.lock', 'cpp/tokenizer-shim/src/**', 'cpp/sudachi-shim/src/**') }}

      - name: build (helper + core tests, MSVC/Ninja)
        shell: cmd
        run: |
          call cpp\winenv.bat || exit /b 1
          cmake -S cpp -B cpp\build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build cpp\build --target jp_pii_helper unit_tests phase0_tokenize phase3_tokenize || exit /b 1

      # Linux と同じ 3 本。tokenizer（ゲート・語境界）と utf8 は MSVC でも Python と一致すること
      - name: core tests
        working-directory: cpp
        shell: cmd
        run: |
          build\unit_tests.exe || exit /b 1
          build\phase0_tokenize.exe || exit /b 1
          build\phase3_tokenize.exe || exit /b 1

      - name: helper (self-test + stdio smoke)
        working-directory: cpp
        shell: cmd
        run: |
          build\jp-pii-helper.exe --selftest --data models || exit /b 1
          python tools\helper_smoke.py build\jp-pii-helper.exe --data models || exit /b 1

      - name: XLL (Excel-DNA, net48)
        run: dotnet build excel/JpPiiSanitizer.Excel -c Release -nologo -v q

      # 版: タグなら v0.7.0 → 0.7.0、それ以外は 0.0.<run_number>（Inno の VersionInfo は数字のみ）
      - name: installer (Inno Setup)
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' -replace '^v', '' } else { '0.0.${{ github.run_number }}' }
          powershell -NoProfile -ExecutionPolicy Bypass -File excel/installer/build_installer.ps1 -Version $v -SkipBuild -Portable
          Get-ChildItem excel/dist

      # setup.exe とポータブル zip（インストーラ不要・手順書入り）の両方
      - name: upload setup.exe + portable zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: jp-pii-sanitizer-excel
          path: |
            excel/dist/*.exe
            excel/dist/*.zip
          retention-days: 14
          compression-level: 0   # 中身はもう圧縮済み（lzma2 / deflate）

      - name: attach to Release (tag only, draft)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag --notes "Excel add-in installer (per-user). See excel/README.md."
          }
          gh release upload $tag (Get-ChildItem excel/dist/*.exe, excel/dist/*.zip).FullName --clobber
